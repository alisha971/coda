# Target extraction and the conditioning set.
#
# The prosody parameters are pinned identically in both execution environments.
# An F0 tracker whose defaults shift between library versions would move every
# target value in the study, so these are configuration, not defaults.

prosody:
  backend: parselmouth        # Praat; matches the source of the cited feature set
  f0_floor_hz: 75.0
  f0_ceiling_hz: 500.0
  frame_step_s: 0.01
  boundary_window_s: 0.300    # the final-300 ms log-F0 slope
  min_voiced_frames: 10       # below this the turn is dropped and counted
  # Praat's autocorrelation pitch settings, written out rather than left to
  # library defaults (the values are Praat's own defaults).
  max_candidates: 15
  very_accurate: false
  silence_threshold: 0.03
  voicing_threshold: 0.45
  octave_cost: 0.01
  octave_jump_cost: 0.35
  voiced_unvoiced_cost: 0.14
  intensity_subtract_mean: true   # removes DC offset before intensity, Praat default

  # Where pitch is analysed.
  # "vad"                 - released voice-activity segments only
  # "vad_plus_transcript" - plus the regions the transcript places speech in,
  #                         merged within the gap below. The detector misses
  #                         documented speech on some files, which left long
  #                         turns unmeasured; the union can only widen coverage.
  pitch_segment_source: vad_plus_transcript
  pitch_segment_merge_gap_s: 0.050

# Four blocks, eight dimensions. Confirmatory inference is at block level:
# four tests, equal weight. See PREREGISTRATION.md section 4 for the count.
target_blocks:
  pitch_level_span: [mean_log_f0, log_f0_range_p95_p5]
  pitch_boundary:   [log_f0_slope_final_300ms]
  energy:           [mean_intensity, intensity_range]
  timing:           [articulation_rate, pause_ratio, longest_internal_pause]

text:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  # Pinned Hub commit (main on 2026-10-16; its last change was model-card metadata
  # only). Weights are downloaded by notebook 09.
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  frozen: true                # never trained
  pca_dim: 64                 # fitted on training data only

ssl:
  sources: [wavlm_l3, wavlm_l6, wavlm_l9, wavlm_l12, hubert_final]
  frozen: true                # no gradient reaches these, for any speaker
  tail_seconds: 8.0           # turn-final: the material adjacent to the reply
  max_frames: 400             # at 50 Hz
  pca_dim: 128                # fitted on training partner turns only
  dtype: float16

metadata: [reply_word_count, reply_syllable_count, turn_position,
           conversation_loudness_offset, replier_identity]
